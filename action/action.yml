name: StitchGuard Visual Check
description: Compare target design screenshots with your app and generate agent repair reports
branding:
  icon: image
  color: purple
inputs:
  target:
    description: Path to target design screenshot
    required: true
  url:
    description: URL to capture (use check mode)
    required: false
  actual:
    description: Path to actual screenshot (use compare mode)
    required: false
  threshold:
    description: Visual match threshold (0-1)
    required: false
    default: '0.85'
  viewport:
    description: Viewport size WxH
    required: false
    default: '390x844'
  wait:
    description: Wait time before screenshot in ms
    required: false
    default: '1000'
  output-dir:
    description: Output directory for artifacts
    required: false
    default: '.stitchguard'
  comment-on-pr:
    description: Post PR comment with visual report summary
    required: false
    default: 'true'
  upload-artifacts:
    description: Upload diff, heatmap, report, and prompt as workflow artifacts
    required: false
    default: 'true'
  fail-on-threshold:
    description: Fail the job when visual match is below threshold
    required: false
    default: 'true'
  attach-prompt:
    description: Include codex-fix-prompt.md as collapsible section in PR comment
    required: false
    default: 'false'
  install-playwright:
    description: Install Playwright Chromium when url is set
    required: false
    default: 'true'
  artifact-name:
    description: Name for uploaded workflow artifacts
    required: false
    default: 'stitchguard-report'
outputs:
  score:
    description: Visual match score (0-1)
    value: ${{ steps.stitchguard.outputs.score }}
  passed:
    description: Whether the check passed the threshold
    value: ${{ steps.stitchguard.outputs.passed }}
  report-path:
    description: Path to generated report.md
    value: ${{ steps.stitchguard.outputs.report-path }}
  artifact-url:
    description: Link to the workflow run (artifacts tab)
    value: ${{ steps.stitchguard.outputs.artifact-url }}
  output-dir:
    description: Directory containing generated artifacts
    value: ${{ steps.stitchguard.outputs.output-dir }}
runs:
  using: composite
  steps:
    - name: Install Playwright Chromium
      if: inputs.url != '' && inputs.install-playwright != 'false'
      shell: bash
      run: npx playwright install chromium --with-deps

    - name: Run StitchGuard
      id: stitchguard
      shell: bash
      run: node "${{ github.action_path }}/dist/index.js"
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_ACTUAL: ${{ inputs.actual }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_VIEWPORT: ${{ inputs.viewport }}
        INPUT_WAIT: ${{ inputs.wait }}
        INPUT_OUTPUT-DIR: ${{ inputs.output-dir }}
        INPUT_COMMENT-ON-PR: ${{ inputs.comment-on-pr }}
        INPUT_FAIL-ON-THRESHOLD: ${{ inputs.fail-on-threshold }}
        INPUT_ATTACH-PROMPT: ${{ inputs.attach-prompt }}
        INPUT_UPLOAD-ARTIFACTS: ${{ inputs.upload-artifacts }}

    - name: Upload artifacts
      if: inputs.upload-artifacts != 'false'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir }}/

name: Visual Design Guard

on:
  pull_request:
    branches: [main]

jobs:
  stitchguard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - run: pnpm generate-screenshots

      - run: pnpm build

      - name: Run StitchGuard compare
        uses: ./.github/actions/stitchguard
        with:
          target: examples/screenshots/target.png
          actual: examples/screenshots/actual.png
          threshold: '0.70'
          comment-on-pr: 'true'

      - name: Upload visual report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stitchguard-report
          path: .stitchguard/

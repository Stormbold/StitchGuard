name: Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - run: pnpm generate-screenshots

      - run: pnpm build

      - run: pnpm test

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: stitchguard-cli
          path: packages/cli/dist/

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm generate-screenshots

      - run: pnpm build

      - run: pnpm build:action

      - run: pnpm lint

      - run: pnpm test

      - name: Demo compare
        run: pnpm exec stitchguard compare examples/screenshots/target.png examples/screenshots/actual.png

      - name: Upload demo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stitchguard-demo
          path: .stitchguard/

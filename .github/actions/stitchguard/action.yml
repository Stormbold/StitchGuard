name: StitchGuard Visual Check
description: Delegates to the publishable action bundle at repo root
inputs:
  target:
    description: Path to target design screenshot
    required: true
  url:
    description: URL to capture (use check mode)
    required: false
  actual:
    description: Path to actual screenshot (use compare mode)
    required: false
  threshold:
    description: Visual match threshold (0-1)
    required: false
    default: '0.85'
  viewport:
    description: Viewport size WxH
    required: false
    default: '390x844'
  wait:
    description: Wait time before screenshot in ms
    required: false
    default: '1000'
  output-dir:
    description: Output directory for artifacts
    required: false
    default: '.stitchguard'
  comment-on-pr:
    description: Post PR comment with visual report summary
    required: false
    default: 'true'
  upload-artifacts:
    description: Upload diff, heatmap, report, and prompt as workflow artifacts
    required: false
    default: 'true'
  fail-on-threshold:
    description: Fail the job when visual match is below threshold
    required: false
    default: 'true'
  attach-prompt:
    description: Include codex-fix-prompt.md as collapsible section in PR comment
    required: false
    default: 'false'
  install-playwright:
    description: Install Playwright Chromium when url is set
    required: false
    default: 'true'
  artifact-name:
    description: Name for uploaded workflow artifacts
    required: false
    default: 'stitchguard-report'
runs:
  using: composite
  steps:
    - uses: ../../../action
      with:
        target: ${{ inputs.target }}
        url: ${{ inputs.url }}
        actual: ${{ inputs.actual }}
        threshold: ${{ inputs.threshold }}
        viewport: ${{ inputs.viewport }}
        wait: ${{ inputs.wait }}
        output-dir: ${{ inputs.output-dir }}
        comment-on-pr: ${{ inputs.comment-on-pr }}
        upload-artifacts: ${{ inputs.upload-artifacts }}
        fail-on-threshold: ${{ inputs.fail-on-threshold }}
        attach-prompt: ${{ inputs.attach-prompt }}
        install-playwright: ${{ inputs.install-playwright }}
        artifact-name: ${{ inputs.artifact-name }}
